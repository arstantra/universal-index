<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Index — Archivio Personale</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #4f7cff;
      --accent2: #7c4fff;
      --text: #e8eaf6;
      --text2: #8b92c4;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --err: #ff5c5c;
      --da-svuotare: #ff7043;
      --rossa: #ff5c5c;
      --gialla: #f0b429;
      --blu: #4f7cff;
      --radius: 8px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

    /* HEADER */
    header {
      background: linear-gradient(135deg, var(--surface) 0%, #1e2140 100%);
      border-bottom: 1px solid var(--border);
      padding: 18px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
    header h1 span { color: var(--accent); }
    #lastUpdated { color: var(--text2); font-size: 12px; }

    /* LAYOUT */
    .app { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 62px); }

    /* ── SIDEBAR ─────────────────────────────────────────────────────────────── */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 4px;
    }
    aside .section-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
      color: var(--text2); padding: 4px 8px 8px; margin-top: 4px;
    }

    /* Voce "Tutte" */
    .fonte-all {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: var(--radius); cursor: pointer;
      transition: background .1s; margin-bottom: 4px;
    }
    .fonte-all:hover { background: var(--surface2); }
    .fonte-all.active { background: var(--surface2); }
    .fonte-all-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .fonte-all-name { flex: 1; font-size: 13px; font-weight: 500; }
    .fonte-all-count { font-size: 11px; color: var(--text2); background: var(--surface2); padding: 2px 7px; border-radius: 10px; }

    /* Supporto fisico/virtuale */
    .supporto-wrap { margin-bottom: 2px; }
    .supporto-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: var(--radius); cursor: pointer;
      transition: background .1s; user-select: none;
    }
    .supporto-row:hover { background: var(--surface2); }
    .supporto-row.active { background: var(--surface2); }
    .supporto-arrow { font-size: 8px; color: var(--text2); width: 10px; text-align: center; flex-shrink: 0; transition: transform .15s; }
    .supporto-arrow.open { transform: rotate(90deg); }
    .supporto-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-locale  { background: var(--accent); }
    .dot-gdrive  { background: var(--ok); }
    .dot-dropbox { background: #6c86c4; }
    .supporto-name { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .supporto-stato {
      font-size: 10px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; font-weight: 500; flex-shrink: 0;
    }
    .supporto-stato.attivo    { background: #0d3326; color: var(--ok); }
    .supporto-stato.parziale  { background: #0d2035; color: #6aadff; }
    .supporto-stato.da-collegare { background: #1e1e2e; color: var(--text2); }
    .supporto-stato.da-svuotare  { background: #2a1200; color: var(--da-svuotare); }
    .supporto-count { font-size: 11px; color: var(--text2); background: var(--surface2); padding: 1px 6px; border-radius: 10px; flex-shrink: 0; }

    /* Etichette sotto un supporto */
    .etichette-list { display: none; padding-left: 18px; }
    .etichette-list.open { display: block; }
    .etichetta-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 10px; border-radius: var(--radius); cursor: pointer;
      transition: background .1s; margin-bottom: 1px;
    }
    .etichetta-row:hover { background: var(--surface2); }
    .etichetta-row.active { background: var(--surface2); }
    .etichetta-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-rossa  { background: var(--rossa); }
    .dot-gialla { background: var(--gialla); }
    .dot-blu    { background: var(--blu); }
    .dot-nessuna { background: #555; }
    .etichetta-name { flex: 1; font-size: 12px; }
    .etichetta-count { font-size: 10px; color: var(--text2); background: var(--surface2); padding: 1px 6px; border-radius: 10px; flex-shrink: 0; }
    .etichetta-stato { font-size: 10px; color: var(--text2); }

    .add-fonte-btn {
      width: 100%; padding: 8px; border-radius: var(--radius);
      background: transparent; border: 1px dashed var(--border);
      color: var(--text2); cursor: pointer; font-size: 12px;
      transition: all .15s; margin-top: 8px;
    }
    .add-fonte-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* MAIN */
    main { padding: 22px 28px; overflow-y: auto; }

    /* STATS BAR */
    .stats { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 18px; flex: 1; min-width: 110px;
    }
    .stat-card .num { font-size: 26px; font-weight: 700; color: var(--accent); }
    .stat-card .lbl { font-size: 10px; color: var(--text2); margin-top: 2px; text-transform: uppercase; letter-spacing: .06em; }

    /* CONTEXT BREADCRUMB */
    #contextBar {
      font-size: 12px; color: var(--text2); margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    #contextBar .crumb-sep { opacity: .4; }
    #contextBar .crumb-etichetta { font-weight: 600; }

    /* TOOLBAR */
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .search-wrap { position: relative; flex: 1; min-width: 200px; }
    .search-wrap input {
      width: 100%; padding: 8px 12px 8px 34px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-size: 13px; outline: none; transition: border .15s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 13px; pointer-events: none; }
    select {
      padding: 8px 11px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 13px; outline: none; cursor: pointer;
    }
    select:focus { border-color: var(--accent); }

    /* VIEW TOGGLE */
    .view-toggle {
      display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; flex-shrink: 0;
    }
    .view-toggle button {
      padding: 7px 13px; background: transparent; border: none; color: var(--text2);
      cursor: pointer; font-size: 12px; font-weight: 500; transition: all .15s; white-space: nowrap;
    }
    .view-toggle button:hover { background: var(--surface2); color: var(--text); }
    .view-toggle button.active { background: var(--surface2); color: var(--accent); }
    .view-toggle button:first-child { border-right: 1px solid var(--border); }

    /* TABLE */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 9px 13px;
      font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--text2); border-bottom: 1px solid var(--border);
      cursor: pointer; user-select: none; white-space: nowrap;
    }
    thead th:hover { color: var(--text); }
    thead th .sort-arrow { margin-left: 4px; opacity: .4; }
    thead th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; cursor: default; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 9px 13px; font-size: 13px; vertical-align: middle; }
    .cell-titolo { font-weight: 500; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell-percorso { color: var(--text2); font-size: 11px; font-family: monospace; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* BADGES */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .badge-stato-completo       { background: #0d3326; color: var(--ok); }
    .badge-stato-in-lavorazione { background: #1a2a45; color: #6aadff; }
    .badge-stato-da-revisionare { background: #2a2300; color: var(--warn); }
    .badge-stato-archivio-morto { background: #1e1e1e; color: #888; }
    .badge-tipo { background: var(--surface2); color: var(--text2); }
    .badge-etichetta-rossa  { background: #2a0d0d; color: var(--rossa); }
    .badge-etichetta-gialla { background: #2a2000; color: var(--gialla); }
    .badge-etichetta-blu    { background: #0d1a35; color: var(--blu); }
    .badge-etichetta-none   { background: var(--surface2); color: var(--text2); }

    /* STATO BUTTON */
    .stato-btn {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;
      white-space: nowrap; cursor: pointer; border: none; position: relative; transition: opacity .15s, transform .1s;
    }
    .stato-btn:hover:not(.frozen) { opacity: .8; transform: scale(1.05); }
    .stato-btn.frozen { cursor: not-allowed; opacity: .5; }
    .stato-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,.5); min-width: 170px; padding: 4px;
    }
    .stato-dropdown-opt {
      padding: 7px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
      transition: background .1s; display: flex; align-items: center; gap: 8px;
    }
    .stato-dropdown-opt:hover { background: var(--surface2); }
    .stato-dropdown-opt.current { opacity: .35; cursor: default; pointer-events: none; }
    .dot-opt { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-completo       { background: var(--ok); }
    .dot-in-lavorazione { background: #6aadff; }
    .dot-da-revisionare { background: var(--warn); }
    .dot-archivio-morto { background: #888; }

    /* ── TREE VIEW ─────────────────────────────────────────────────────────── */
    .tree-wrap { display: block; }

    /* Livello 0: Etichetta */
    .tree-etichetta-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; cursor: pointer; border-radius: var(--radius);
      transition: background .1s; user-select: none; margin-bottom: 2px;
      border-left: 3px solid transparent;
    }
    .tree-etichetta-row:hover { background: var(--surface2); }
    .tree-etichetta-row.et-rossa  { border-left-color: var(--rossa); }
    .tree-etichetta-row.et-gialla { border-left-color: var(--gialla); }
    .tree-etichetta-row.et-blu    { border-left-color: var(--blu); }
    .tree-etichetta-row.et-none   { border-left-color: #555; }

    .tree-folder-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; cursor: pointer; border-radius: var(--radius);
      transition: background .1s; user-select: none;
    }
    .tree-folder-row:hover { background: var(--surface2); }
    .tree-arrow { font-size: 8px; color: var(--text2); width: 10px; text-align: center; flex-shrink: 0; transition: transform .15s; }
    .tree-arrow.open { transform: rotate(90deg); }
    .tree-folder-icon { font-size: 14px; flex-shrink: 0; }
    .tree-folder-name { font-size: 13px; font-weight: 500; flex: 1; }
    .tree-folder-count {
      font-size: 11px; color: var(--text2); background: var(--surface2);
      padding: 1px 7px; border-radius: 10px; flex-shrink: 0;
    }
    .tree-children { display: none; }
    .tree-children.open { display: block; }

    .tree-leaf-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 12px; border-radius: var(--radius); transition: background .1s;
    }
    .tree-leaf-row:hover { background: var(--surface2); }
    .tree-leaf-icon  { font-size: 12px; flex-shrink: 0; color: var(--text2); }
    .tree-leaf-title { font-size: 13px; flex: 1; }
    .tree-leaf-tags  { font-size: 11px; color: var(--text2); max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 60px 20px; color: var(--text2); }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }

    /* FOCUS PANEL */
    .focus-section { margin-top: 28px; }
    .focus-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 900px) { .focus-grid { grid-template-columns: 1fr; } }
    .focus-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
    }
    .focus-attivo { border-top: 2px solid var(--accent); }
    .focus-backlog { border-top: 2px solid var(--accent2); }
    .focus-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .focus-label {
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text2); flex: 1;
    }
    .focus-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-attivo  { background: var(--accent); }
    .dot-backlog { background: var(--accent2); }
    .focus-nome-display {
      font-size: 13px; font-weight: 600; color: var(--text);
      padding: 5px 0; margin-bottom: 8px; min-height: 24px;
      border-bottom: 1px solid var(--border);
    }
    .focus-nome-display.empty { color: #3a3f60; font-weight: 400; font-style: italic; font-size: 12px; }
    .focus-azione-input {
      width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border);
      color: var(--ok); font-family: var(--font); font-size: 12px;
      padding: 5px 0; outline: none; transition: border-color .15s;
    }
    .focus-azione-input:focus { border-bottom-color: var(--accent); }
    .focus-azione-input::placeholder { color: #2a5a3e; }
    .focus-azione-input:disabled { opacity: .3; cursor: not-allowed; }
    .backlog-list { display: flex; flex-direction: column; gap: 5px; }
    .backlog-item { display: flex; align-items: center; gap: 6px; }
    .backlog-bullet { color: var(--accent2); font-size: 10px; flex-shrink: 0; }
    .backlog-title {
      flex: 1; font-size: 12px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .backlog-promote {
      background: transparent; border: none; color: var(--accent);
      cursor: pointer; font-size: 11px; padding: 1px 4px;
      opacity: .35; transition: opacity .15s; flex-shrink: 0;
    }
    .backlog-promote:hover { opacity: 1; }
    .backlog-del {
      background: transparent; border: none; color: #3a3f60; cursor: pointer;
      font-size: 14px; padding: 0 2px; transition: color .15s; line-height: 1; flex-shrink: 0;
    }
    .backlog-del:hover { color: var(--err); }

    /* FOCUS ROW CONTROL */
    .focus-row-btn {
      background: transparent; border: 1px solid transparent; cursor: pointer;
      font-size: 11px; padding: 2px 5px; border-radius: 4px;
      color: var(--text2); opacity: .35; transition: all .15s;
      line-height: 1; display: block; white-space: nowrap;
    }
    .focus-row-btn:hover { opacity: 1; border-color: var(--border); background: var(--surface2); }
    .focus-row-btn.focus-row-attivo { color: var(--accent);  opacity: 1 !important; border-color: var(--accent); }
    .focus-row-btn.focus-row-coda   { color: var(--accent2); opacity: 1 !important; border-color: var(--accent2); }
    .focus-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,.5); min-width: 195px; padding: 4px;
    }
    .focus-dropdown-opt {
      padding: 7px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
      transition: background .1s; white-space: nowrap;
    }
    .focus-dropdown-opt:hover { background: var(--surface2); }

    /* TOAST */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 18px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
      transform: translateY(80px); opacity: 0; transition: all .25s;
      max-width: 320px; pointer-events: none;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.ok   { border-left: 3px solid var(--ok); }
    #toast.warn { border-left: 3px solid var(--warn); }
    #toast.err  { border-left: 3px solid var(--err); }

    /* MODAL */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 28px; width: 480px; max-width: 95vw;
    }
    .modal h3 { font-size: 16px; margin-bottom: 20px; }
    .modal-tabs { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
    .modal-tab { flex: 1; padding: 8px; background: transparent; border: none; color: var(--text2); cursor: pointer; font-size: 12px; font-weight: 500; transition: all .15s; }
    .modal-tab:hover { background: var(--surface2); color: var(--text); }
    .modal-tab.active { background: var(--surface2); color: var(--accent); }
    .modal-tab:first-child { border-right: 1px solid var(--border); }
    .modal-panel { display: none; }
    .modal-panel.active { display: block; }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    .form-row input, .form-row select { width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; outline: none; }
    .form-row input:focus, .form-row select:focus { border-color: var(--accent); }
    .form-hint { font-size: 11px; color: var(--text2); margin-top: 4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn { padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: opacity .15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .85; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--text2); }

    #localBadge {
      display: none; font-size: 11px; padding: 3px 10px; border-radius: 10px;
      background: #0d3326; color: var(--ok); border: 1px solid #1a5c3a; margin-top: 10px; text-align: center;
    }

    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 240px; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Universal <span>Index</span></h1>
    <div id="lastUpdated">Caricamento...</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <button class="btn btn-ghost" id="btnSyncDrive" style="display:none" onclick="syncDrive()" title="Carica data.json su Google Drive (versione pubblica)">☁ Sincronizza</button>
    <button class="btn btn-ghost" onclick="exportJSON()">⬇ Esporta JSON</button>
    <button class="btn btn-primary" onclick="openModal()">＋ Aggiungi Fonte</button>
  </div>
</header>

<div class="app">

  <aside>
    <div id="fonteList"></div>
    <div id="localBadge">● server locale attivo</div>
  </aside>

  <main>
    <div class="stats" id="statsBar"></div>

    <div id="contextBar"></div>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="text" placeholder="Cerca per titolo, percorso, tag..." oninput="applyFilters()" />
      </div>
      <select id="filterStato" onchange="applyFilters()">
        <option value="">Tutti gli stati</option>
        <option value="completo">Completo</option>
        <option value="in-lavorazione">In lavorazione</option>
        <option value="da-revisionare">Da revisionare</option>
        <option value="archivio-morto">Archivio morto</option>
      </select>
      <select id="filterTipo" onchange="applyFilters()">
        <option value="">Tutti i tipi</option>
        <option value="progetto">Progetto</option>
        <option value="relazione">Relazione</option>
        <option value="convegno">Convegno</option>
        <option value="appunti">Appunti</option>
        <option value="portfolio">Portfolio</option>
        <option value="archivio">Archivio</option>
      </select>
      <select id="filterAnno" onchange="applyFilters()">
        <option value="">Tutti gli anni</option>
      </select>
      <div class="view-toggle">
        <button id="btnLista"              onclick="switchView('lista')">☰ Lista</button>
        <button id="btnAlbero" class="active" onclick="switchView('albero')">🌲 Albero</button>
      </div>
    </div>

    <!-- Vista lista -->
    <div class="table-wrap" id="tableWrap">
      <table>
        <thead>
          <tr>
            <th style="width:48px;">Focus</th>
            <th onclick="sortBy('titolo')">Titolo <span class="sort-arrow" id="arrow-titolo">↕</span></th>
            <th onclick="sortBy('anno')">Anno <span class="sort-arrow" id="arrow-anno">↕</span></th>
            <th onclick="sortBy('tipo')">Tipo <span class="sort-arrow" id="arrow-tipo">↕</span></th>
            <th onclick="sortBy('stato')">Stato <span class="sort-arrow" id="arrow-stato">↕</span></th>
            <th onclick="sortBy('etichetta')">Etichetta <span class="sort-arrow" id="arrow-etichetta">↕</span></th>
            <th>Percorso</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- Vista albero -->
    <div class="tree-wrap" id="treeWrap"></div>

    <div id="emptyState" class="empty" style="display:none;">
      <div class="icon">📂</div>
      <div>Nessuna voce trovata con i filtri attivi.</div>
    </div>

    <div class="focus-section" id="focusSection">
      <div class="focus-grid">
        <!-- PROGETTO ATTIVO -->
        <div class="focus-card focus-attivo">
          <div class="focus-header">
            <span class="focus-dot dot-attivo"></span>
            <span class="focus-label">Progetto attivo</span>
          </div>
          <div id="focusNomeDisplay" class="focus-nome-display empty">seleziona ▶ in tabella</div>
          <input class="focus-azione-input" id="focusAzione" disabled placeholder="Prossima azione fisica..." oninput="saveFocusAzione()" />
        </div>
        <!-- IN CODA -->
        <div class="focus-card focus-backlog">
          <div class="focus-header">
            <span class="focus-dot dot-backlog"></span>
            <span class="focus-label">In coda</span>
            <span id="codaCounter" style="font-size:11px;color:var(--text2);">0 / 5</span>
          </div>
          <div id="backlogList" class="backlog-list"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL aggiungi fonte -->
<div class="overlay" id="modal">
  <div class="modal">
    <h3>➕ Aggiungi Fonte</h3>
    <div class="modal-tabs">
      <button class="modal-tab active" onclick="switchModalTab('supporto')">Nuovo supporto</button>
      <button class="modal-tab" onclick="switchModalTab('etichetta')">Etichetta su supporto esistente</button>
    </div>

    <!-- Panel: Nuovo supporto -->
    <div class="modal-panel active" id="panel-supporto">
      <div class="form-row">
        <label>Nome del supporto</label>
        <input id="m-label" type="text" placeholder="es. Computer Dell, SSD Samsung T7" />
      </div>
      <div class="form-row">
        <label>Tipo</label>
        <select id="m-tipo">
          <option value="locale">Locale (computer / HD / SSD)</option>
          <option value="gdrive">Google Drive</option>
          <option value="dropbox">Dropbox</option>
          <option value="altro">Altro</option>
        </select>
      </div>
      <div class="form-row">
        <label>Note (opzionale)</label>
        <input id="m-note" type="text" placeholder="es. account, descrizione..." />
      </div>
    </div>

    <!-- Panel: Etichetta su supporto esistente -->
    <div class="modal-panel" id="panel-etichetta">
      <div class="form-row">
        <label>Supporto</label>
        <select id="m-supporto-sel"></select>
      </div>
      <div class="form-row">
        <label>Nome etichetta</label>
        <input id="m-et-label" type="text" placeholder="es. Etichetta Verde" />
      </div>
      <div class="form-row">
        <label>Colore</label>
        <select id="m-et-colore">
          <option value="rossa">🔴 Rossa — progetti caldi</option>
          <option value="gialla">🟡 Gialla — architettura / design</option>
          <option value="blu">🔵 Blu — fotografie / video / archivio</option>
          <option value="verde">🟢 Verde</option>
          <option value="altro">⚪ Altro</option>
        </select>
      </div>
      <div class="form-row">
        <label>Percorso radice (opzionale — se già disponibile)</label>
        <input id="m-et-percorso" type="text" placeholder="es. D:/Etichetta_Rossa" />
        <div class="form-hint">Lascia vuoto se il supporto non è ancora collegato</div>
      </div>
      <div class="form-row">
        <label>Descrizione (opzionale)</label>
        <input id="m-et-desc" type="text" placeholder="es. Progetti in corso" />
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="aggiungi()">Aggiungi</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
  let db = { meta: {}, fonti: [], voci: [] };
  let filteredVoci = [];
  let activeFonte    = 'all';   // 'all' | supporto id | 'etichetta:id'
  let sortKey        = 'anno';
  let sortDir        = -1;
  let currentView    = 'albero';
  let expandedNodes  = new Set();
  let expandedSupporti = new Set();
  let currentModalTab = 'supporto';

  const isLocal = location.protocol === 'http:' &&
    (location.hostname === 'localhost' || location.hostname === '127.0.0.1');

  // ─── LOAD ───────────────────────────────────────────────────────────────────
  // In locale (server.py): data.json fresco dal disco — le modifiche appaiono subito.
  // Su GitHub Pages: dati pubblici serviti dall'Apps Script (data.json su Drive).
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxdsARp1UBp1vL-QMiq6oiXdMxrm9jpDox9dYV-whh1nogDuBBiD471LaqfjiWgOZTX/exec';

  async function loadData() {
    try {
      const url = isLocal ? 'data.json?t=' + Date.now() : APPS_SCRIPT_URL;
      const r = await fetch(url);
      db = await r.json();
    } catch(e) {
      db = { meta: { lastUpdated: '—' }, fonti: [], voci: [] };
    }
    init();
  }

  function init() {
    document.getElementById('lastUpdated').textContent = 'Aggiornato: ' + (db.meta.lastUpdated || '—');
    if (isLocal) {
      document.getElementById('localBadge').style.display = 'block';
      document.getElementById('btnSyncDrive').style.display = 'inline-block';
    }
    renderSidebar();
    populateAnnoFilter();
    applyFilters();
    renderFocusPanel();
  }

  // ─── HELPERS ────────────────────────────────────────────────────────────────
  // Escaping HTML: i titoli/percorsi vengono dai README e possono contenere " ' < > &
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function getSupporto(id) { return db.fonti.find(f => f.id === id); }

  function getEtichetta(eId) {
    for (const f of db.fonti) {
      const et = (f.etichette || []).find(e => e.id === eId);
      if (et) return { supporto: f, etichetta: et };
    }
    return null;
  }

  function allEtichette() {
    const result = [];
    db.fonti.forEach(f => (f.etichette || []).forEach(e => result.push({ supporto: f, etichetta: e })));
    return result;
  }

  function vociDiSupporto(fId) { return db.voci.filter(v => v.fonte === fId); }
  function vociDiEtichetta(eId) { return db.voci.filter(v => v.etichetta === eId); }

  function etichettaLabel(eId) {
    if (!eId) return 'Non classificato';
    const r = getEtichetta(eId);
    return r ? r.etichetta.label : eId;
  }

  function etichettaColore(eId) {
    if (!eId) return 'nessuna';
    const r = getEtichetta(eId);
    return r ? r.etichetta.colore : 'nessuna';
  }

  // Restituisce le voci filtrate per la selezione corrente (prima di altri filtri)
  function voceMatchesSelezione(v) {
    if (activeFonte === 'all') return true;
    if (activeFonte.startsWith('et:')) return v.etichetta === activeFonte.slice(3);
    return v.fonte === activeFonte;
  }

  // ─── SIDEBAR ────────────────────────────────────────────────────────────────
  function renderSidebar() {
    const container = document.getElementById('fonteList');
    const totalCount = db.voci.length;

    let html = `
      <div class="section-label">Fonti</div>
      <div class="fonte-all ${activeFonte === 'all' ? 'active' : ''}" onclick="selectFonte('all')">
        <div class="fonte-all-dot"></div>
        <div class="fonte-all-name">Tutte le fonti</div>
        <div class="fonte-all-count">${totalCount}</div>
      </div>`;

    db.fonti.forEach(f => {
      const vociF   = vociDiSupporto(f.id);
      const isOpen  = expandedSupporti.has(f.id);
      const isActive = activeFonte === f.id;
      const statoClass = (f.stato || 'da-collegare').replace(/\s/g, '-');
      const hasEt = (f.etichette || []).length > 0;

      html += `<div class="supporto-wrap">
        <div class="supporto-row ${isActive ? 'active' : ''}" onclick="selectFonte('${f.id}')">
          ${hasEt
            ? `<span class="supporto-arrow ${isOpen ? 'open' : ''}" onclick="toggleSupporto(event,'${f.id}')">▶</span>`
            : `<span style="width:10px;flex-shrink:0"></span>`}
          <div class="supporto-dot dot-${f.tipo}"></div>
          <div class="supporto-name" title="${esc(f.label)}">${esc(f.label)}</div>
          ${vociF.length > 0
            ? `<div class="supporto-count">${vociF.length}</div>`
            : `<span class="supporto-stato ${statoClass}">${f.stato || 'da-collegare'}</span>`}
        </div>`;

      if (hasEt) {
        html += `<div class="etichette-list ${isOpen ? 'open' : ''}" id="et-list-${f.id}">`;
        (f.etichette || []).forEach(e => {
          const vociE  = vociDiEtichetta(e.id);
          const eKey   = 'et:' + e.id;
          const isActE = activeFonte === eKey;
          html += `
            <div class="etichetta-row ${isActE ? 'active' : ''}" onclick="selectFonte('${eKey}')">
              <div class="etichetta-dot dot-${e.colore || 'nessuna'}"></div>
              <div class="etichetta-name">${esc(e.label)}</div>
              ${vociE.length > 0
                ? `<div class="etichetta-count">${vociE.length}</div>`
                : `<span class="etichetta-stato">${e.stato || 'da-collegare'}</span>`}
            </div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });

    html += `<button class="add-fonte-btn" onclick="openModal()">＋ Aggiungi fonte</button>`;
    container.innerHTML = html;
  }

  function toggleSupporto(e, id) {
    e.stopPropagation();
    if (expandedSupporti.has(id)) expandedSupporti.delete(id);
    else expandedSupporti.add(id);
    renderSidebar();
  }

  function selectFonte(id) {
    activeFonte = id;
    // Auto-espandi il supporto padre se selezioniamo un'etichetta
    if (id.startsWith('et:')) {
      const eId = id.slice(3);
      for (const f of db.fonti) {
        if ((f.etichette || []).some(e => e.id === eId)) {
          expandedSupporti.add(f.id);
          break;
        }
      }
    }
    renderSidebar();
    applyFilters();
    updateContextBar();
  }

  function updateContextBar() {
    const bar = document.getElementById('contextBar');
    if (activeFonte === 'all') { bar.innerHTML = ''; return; }
    if (activeFonte.startsWith('et:')) {
      const r = getEtichetta(activeFonte.slice(3));
      if (r) {
        bar.innerHTML = `<span>${esc(r.supporto.label)}</span><span class="crumb-sep">›</span>
          <span class="crumb-etichetta" style="color:var(--${r.etichetta.colore})">${esc(r.etichetta.label)}</span>`;
        return;
      }
    }
    const f = getSupporto(activeFonte);
    if (f) bar.innerHTML = `<span>${esc(f.label)}</span>`;
  }

  // ─── FILTERS ────────────────────────────────────────────────────────────────
  function populateAnnoFilter() {
    const anni = [...new Set(db.voci.map(v => v.anno).filter(Boolean))].sort().reverse();
    const sel  = document.getElementById('filterAnno');
    anni.forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; sel.appendChild(o); });
  }

  function applyFilters() {
    const q     = document.getElementById('searchInput').value.toLowerCase();
    const stato = document.getElementById('filterStato').value;
    const tipo  = document.getElementById('filterTipo').value;
    const anno  = document.getElementById('filterAnno').value;

    filteredVoci = db.voci.filter(v => {
      if (!voceMatchesSelezione(v)) return false;
      if (stato && v.stato !== stato) return false;
      if (tipo  && v.tipo  !== tipo)  return false;
      if (anno  && v.anno  !== anno)  return false;
      if (q) {
        const hay = [v.titolo, v.percorso, ...(v.tags||[])].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    sortData();
    if (currentView === 'lista') renderTable();
    else renderTree();
    renderStats();
  }

  // ─── VIEW TOGGLE ────────────────────────────────────────────────────────────
  function switchView(v) {
    currentView = v;
    document.getElementById('btnLista').classList.toggle('active',  v === 'lista');
    document.getElementById('btnAlbero').classList.toggle('active', v === 'albero');
    document.getElementById('tableWrap').style.display = v === 'lista'  ? 'block' : 'none';
    document.getElementById('treeWrap').style.display  = v === 'albero' ? 'block' : 'none';
    if (v === 'lista') renderTable(); else renderTree();
  }

  // ─── SORT ───────────────────────────────────────────────────────────────────
  function sortBy(key) {
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    document.querySelectorAll('.sort-arrow').forEach(el => el.textContent = '↕');
    document.querySelectorAll('thead th').forEach(el => el.classList.remove('sorted'));
    const th = document.querySelector(`[onclick="sortBy('${key}')"]`);
    if (th) { th.classList.add('sorted'); th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '↑' : '↓'; }
    sortData(); renderTable();
  }

  function sortData() {
    filteredVoci.sort((a,b) => (a[sortKey]||'').toString().localeCompare((b[sortKey]||'').toString()) * sortDir);
  }

  // ─── STATO BADGE ────────────────────────────────────────────────────────────
  function isFonteCollegata(fonteId) {
    if (!isLocal) return false;
    const f = getSupporto(fonteId);
    return f && f.stato !== 'da-collegare' && f.stato !== 'da-svuotare';
  }

  function statoBadgeHTML(v) {
    const cls = `badge-stato-${v.stato || ''}`;
    if (!isLocal) return `<span class="badge ${cls}">${v.stato || '—'}</span>`;
    const col    = isFonteCollegata(v.fonte);
    const frzCls = col ? '' : 'frozen';
    const title  = col ? 'Clicca per cambiare stato' : 'Fonte non collegata — sola lettura';
    return `<button class="stato-btn ${cls} ${frzCls}" title="${title}"
      onclick="onStatoClick(event,'${v.id}','${v.stato}',${col})"
    >${v.stato || '—'}</button>`;
  }

  const STATI_LIST = [
    { val: 'completo',        label: 'Completo' },
    { val: 'in-lavorazione',  label: 'In lavorazione' },
    { val: 'da-revisionare',  label: 'Da revisionare' },
    { val: 'archivio-morto',  label: 'Archivio morto' },
  ];

  function onStatoClick(e, voceId, statoAtt, collegata) {
    e.stopPropagation();
    if (!collegata) return;
    document.querySelectorAll('.stato-dropdown').forEach(d => d.remove());
    const dropdown = document.createElement('div');
    dropdown.className = 'stato-dropdown';
    STATI_LIST.forEach(s => {
      const opt = document.createElement('div');
      opt.className = 'stato-dropdown-opt' + (s.val === statoAtt ? ' current' : '');
      opt.innerHTML = `<span class="dot-opt dot-${s.val}"></span>${s.label}`;
      if (s.val !== statoAtt) opt.onclick = ev => { ev.stopPropagation(); cambiaStato(voceId, s.val); dropdown.remove(); };
      dropdown.appendChild(opt);
    });
    const btn = e.currentTarget;
    btn.style.position = 'relative';
    btn.appendChild(dropdown);
    setTimeout(() => document.addEventListener('click', function h() { dropdown.remove(); document.removeEventListener('click', h); }), 0);
  }

  async function cambiaStato(voceId, nuovoStato) {
    try {
      const res  = await fetch('/api/update-stato', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ voce_id: voceId, stato: nuovoStato })
      });
      const json = await res.json();
      if (!json.ok) { showToast('⚠ ' + (json.error || 'Errore'), 'err'); return; }
      const voce = db.voci.find(v => v.id === voceId);
      if (voce) voce.stato = nuovoStato;
      applyFilters();
      showToast(json.readme_updated ? '✓ Stato salvato — README.md aggiornato' : '⚠ data.json OK, README non trovato', json.readme_updated ? 'ok' : 'warn');
    } catch {
      showToast('✗ Server non raggiungibile', 'err');
    }
  }

  // ─── TABLE ──────────────────────────────────────────────────────────────────
  function etichettaBadgeHTML(eId) {
    const colore = etichettaColore(eId);
    const label  = etichettaLabel(eId);
    return `<span class="badge badge-etichetta-${colore || 'none'}">${esc(label)}</span>`;
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const empty = document.getElementById('emptyState');
    if (filteredVoci.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    tbody.innerHTML = filteredVoci.map(v => {
      const foc    = v.focus || null;
      const focCls = foc ? `focus-row-${foc}` : '';
      const focIco = foc === 'attivo' ? '▶ attivo' : foc === 'coda' ? '· coda' : '○';
      const focArg = foc ? `'${foc}'` : 'null';
      return `
      <tr>
        <td style="width:28px;text-align:center;">
          <button class="focus-row-btn ${focCls}"
            onclick="onFocusClick(event,'${v.id}',${focArg})"
            title="${foc === 'attivo' ? 'Attivo' : foc === 'coda' ? 'In coda' : 'Aggiungi al focus'}"
          >${focIco}</button>
        </td>
        <td>
          <div class="cell-titolo" title="${esc(v.titolo)}">${esc(v.titolo) || '—'}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px;">${esc((v.tags||[]).join(' · '))}</div>
        </td>
        <td>${esc(v.anno) || '—'}</td>
        <td><span class="badge badge-tipo">${esc(v.tipo) || '—'}</span></td>
        <td>${statoBadgeHTML(v)}</td>
        <td>${etichettaBadgeHTML(v.etichetta)}</td>
        <td><div class="cell-percorso" title="${esc(v.percorso)}">${esc(v.percorso) || '—'}</div></td>
      </tr>`;
    }).join('');
  }

  // ─── TREE ───────────────────────────────────────────────────────────────────
  function cleanName(name) {
    return name.replace(/^\d{3}_/, '').replace(/_/g, ' ');
  }

  function buildFolderTree(voci) {
    const root = { children: {}, items: [] };
    voci.forEach(v => {
      const parts = (v.percorso || '').split('/').filter(Boolean);
      if (!parts.length) { root.items.push(v); return; }
      let node = root;
      for (let i = 0; i < parts.length - 1; i++) {
        const p = parts[i];
        if (!node.children[p]) node.children[p] = { name: p, path: parts.slice(0,i+1).join('/'), children: {}, items: [] };
        node = node.children[p];
      }
      const last = parts[parts.length - 1];
      if (!node.children[last]) node.children[last] = { name: last, path: parts.join('/'), children: {}, items: [] };
      node.children[last].items.push(v);
    });
    return root;
  }

  function countItems(node) {
    let n = node.items.length;
    Object.values(node.children).forEach(c => n += countItems(c));
    return n;
  }

  function renderFolderNode(node, depth, prefixId) {
    let html = '';
    const indent = depth * 20;

    Object.keys(node.children).sort((a,b) => a.localeCompare(b)).forEach(key => {
      const child  = node.children[key];
      const total  = countItems(child);
      const nodeId = prefixId + '-tn-' + child.path.replace(/[^a-z0-9]/gi, '-');
      const isOpen = expandedNodes.has(nodeId);

      html += `
        <div>
          <div class="tree-folder-row" style="padding-left:${12 + indent}px" onclick="toggleTreeNode('${nodeId}')">
            <span class="tree-arrow ${isOpen ? 'open' : ''}">▶</span>
            <span class="tree-folder-icon">${depth === 0 ? '🗂' : '📁'}</span>
            <span class="tree-folder-name">${cleanName(key)}</span>
            <span class="tree-folder-count">${total}</span>
          </div>
          <div class="tree-children ${isOpen ? 'open' : ''}" id="${nodeId}">
            ${renderFolderNode(child, depth + 1, prefixId)}
          </div>
        </div>`;
    });

    node.items.forEach(v => {
      const foc    = v.focus || null;
      const focCls = foc ? `focus-row-${foc}` : '';
      const focIco = foc === 'attivo' ? '▶ attivo' : foc === 'coda' ? '· coda' : '○';
      const focArg = foc ? `'${foc}'` : 'null';
      html += `
        <div class="tree-leaf-row" style="padding-left:${12 + indent + 20}px">
          <span class="tree-leaf-icon">📄</span>
          <span class="tree-leaf-title">${esc(v.titolo || cleanName((v.percorso||'').split('/').pop()))}</span>
          ${(v.tags||[]).length ? `<span class="tree-leaf-tags">${esc(v.tags.slice(0,3).join(' · '))}</span>` : ''}
          <span style="margin-left:4px">${statoBadgeHTML(v)}</span>
          <span class="badge badge-tipo" style="margin-left:4px">${v.tipo || '—'}</span>
          <button class="focus-row-btn ${focCls}" style="margin-left:6px"
            onclick="onFocusClick(event,'${v.id}',${focArg})"
            title="${foc === 'attivo' ? 'Attivo' : foc === 'coda' ? 'In coda' : 'Aggiungi al focus'}"
          >${focIco}</button>
        </div>`;
    });

    return html;
  }

  // Raggruppa voci per etichetta e costruisce l'albero con etichetta come primo livello
  function renderTree() {
    const wrap  = document.getElementById('treeWrap');
    const empty = document.getElementById('emptyState');
    if (filteredVoci.length === 0) { wrap.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    // Se siamo già filtrati su una singola etichetta: mostra solo la struttura cartelle
    if (activeFonte.startsWith('et:')) {
      const folderTree = buildFolderTree(filteredVoci);
      wrap.innerHTML = renderFolderNode(folderTree, 0, 'et');
      return;
    }

    // Raggruppa per etichetta
    const ETICHETTE_ORDER = [];
    db.fonti.forEach(f => (f.etichette || []).forEach(e => ETICHETTE_ORDER.push(e.id)));
    ETICHETTE_ORDER.push(null); // Non classificato

    const byEtichetta = new Map();
    filteredVoci.forEach(v => {
      const k = v.etichetta || null;
      if (!byEtichetta.has(k)) byEtichetta.set(k, []);
      byEtichetta.get(k).push(v);
    });

    let html = '';
    ETICHETTE_ORDER.forEach(eId => {
      const vociEt = byEtichetta.get(eId);
      if (!vociEt || vociEt.length === 0) return;

      const label  = etichettaLabel(eId);
      const colore = etichettaColore(eId);
      const nodeId = 'et-root-' + (eId || 'none');
      const isOpen = expandedNodes.has(nodeId);
      const folderTree = buildFolderTree(vociEt);

      html += `
        <div style="margin-bottom:6px">
          <div class="tree-etichetta-row et-${colore}" onclick="toggleTreeNode('${nodeId}')">
            <span class="tree-arrow ${isOpen ? 'open' : ''}">▶</span>
            <span class="etichetta-dot dot-${colore}" style="width:12px;height:12px"></span>
            <span class="tree-folder-name" style="font-size:14px">${label}</span>
            <span class="tree-folder-count">${vociEt.length}</span>
          </div>
          <div class="tree-children ${isOpen ? 'open' : ''}" id="${nodeId}">
            ${renderFolderNode(folderTree, 0, eId || 'none')}
          </div>
        </div>`;
    });

    wrap.innerHTML = html;
  }

  function toggleTreeNode(nodeId) {
    const el = document.getElementById(nodeId);
    if (!el) return;
    const isOpen = el.classList.toggle('open');
    if (isOpen) expandedNodes.add(nodeId); else expandedNodes.delete(nodeId);
    const row = el.previousElementSibling;
    if (row) { const a = row.querySelector('.tree-arrow'); if (a) a.classList.toggle('open', isOpen); }
  }

  // ─── STATS ──────────────────────────────────────────────────────────────────
  function renderStats() {
    const c = s => filteredVoci.filter(v => v.stato === s).length;
    const fontiAttive = db.fonti.filter(f => f.stato !== 'da-collegare').length;
    document.getElementById('statsBar').innerHTML = `
      <div class="stat-card"><div class="num">${filteredVoci.length}</div><div class="lbl">Voci totali</div></div>
      <div class="stat-card"><div class="num" style="color:var(--ok)">${c('completo')}</div><div class="lbl">Completi</div></div>
      <div class="stat-card"><div class="num" style="color:#6aadff">${c('in-lavorazione')}</div><div class="lbl">In lavorazione</div></div>
      <div class="stat-card"><div class="num" style="color:var(--warn)">${c('da-revisionare')}</div><div class="lbl">Da revisionare</div></div>
      <div class="stat-card"><div class="num" style="color:#888">${c('archivio-morto')}</div><div class="lbl">Archivio morto</div></div>
      <div class="stat-card"><div class="num" style="color:var(--accent2)">${db.fonti.length}</div><div class="lbl">Fonti registrate</div></div>`;
  }

  // ─── FOCUS / BACKLOG ────────────────────────────────────────────────────────
  function renderFocusPanel() {
    const attivo = db.voci.find(v => v.focus === 'attivo');
    const coda   = db.voci.filter(v => v.focus === 'coda');

    // Card attivo
    const nomeEl   = document.getElementById('focusNomeDisplay');
    const azioneEl = document.getElementById('focusAzione');
    if (attivo) {
      nomeEl.textContent = attivo.titolo;
      nomeEl.classList.remove('empty');
      azioneEl.value    = attivo.focus_azione || '';
      azioneEl.disabled = !isLocal;
    } else {
      nomeEl.textContent = 'seleziona ▶ in tabella';
      nomeEl.classList.add('empty');
      azioneEl.value    = '';
      azioneEl.disabled = true;
    }

    // Contatore coda
    document.getElementById('codaCounter').textContent = `${coda.length} / 5`;

    // Lista coda
    const codaList = document.getElementById('backlogList');
    if (coda.length === 0) {
      codaList.innerHTML = '<div style="font-size:11px;color:#3a3f60;padding:4px 0;">Nessun progetto in coda</div>';
    } else {
      codaList.innerHTML = coda.map(v => `
        <div class="backlog-item">
          <span class="backlog-bullet">▸</span>
          <span class="backlog-title" title="${esc(v.titolo)}">${esc(v.titolo)}</span>
          ${isLocal ? `
            <button class="backlog-promote" onclick="setFocus('${v.id}','attivo')" title="Promuovi ad attivo">▶</button>
            <button class="backlog-del"     onclick="setFocus('${v.id}',null)"     title="Rimuovi dalla coda">×</button>
          ` : ''}
        </div>`).join('');
    }
  }

  async function setFocus(voceId, nuovoFocus) {
    if (!isLocal) { showToast('⚠ Modifica disponibile solo via server locale', 'warn'); return; }

    const voce       = db.voci.find(v => v.id === voceId);
    const attivoCorr = db.voci.find(v => v.focus === 'attivo' && v.id !== voceId);
    const codaCorr   = db.voci.filter(v => v.focus === 'coda'   && v.id !== voceId);

    // Validazione client-side
    if (nuovoFocus === 'attivo' && attivoCorr && voce.focus !== 'coda' && codaCorr.length >= 5) {
      showToast('⚠ Coda piena (5/5) — rimuovi un progetto prima', 'warn'); return;
    }
    if (nuovoFocus === 'coda' && codaCorr.length >= 5) {
      showToast('⚠ Coda piena (5/5) — rimuovi un progetto prima', 'warn'); return;
    }

    try {
      const res  = await fetch('/api/update-focus', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ voce_id: voceId, focus: nuovoFocus })
      });
      const json = await res.json();
      if (!json.ok) { showToast('⚠ ' + json.error, 'err'); return; }

      // Aggiorna db locale (sono riferimenti agli stessi oggetti)
      if (nuovoFocus === 'attivo' && attivoCorr) { attivoCorr.focus = 'coda'; delete attivoCorr.focus_azione; }
      if (voce) {
        voce.focus = nuovoFocus;
        if (nuovoFocus !== 'attivo') delete voce.focus_azione;
      }

      renderFocusPanel();
      renderTable();
      const msg = nuovoFocus === 'attivo' ? '▶ Progetto attivo' :
                  nuovoFocus === 'coda'   ? '· Aggiunto alla coda' : '○ Rimosso dal focus';
      showToast(msg, 'ok');
    } catch {
      showToast('✗ Server non raggiungibile', 'err');
    }
  }

  function onFocusClick(e, voceId, statoAtt) {
    e.stopPropagation();
    if (!isLocal) return;
    document.querySelectorAll('.focus-dropdown').forEach(d => d.remove());

    const opts = [];
    if (statoAtt !== 'attivo') opts.push({ val: 'attivo', label: '▶  Imposta come Attivo' });
    if (statoAtt !== 'coda')   opts.push({ val: 'coda',   label: '·  Aggiungi alla Coda' });
    if (statoAtt !== null)     opts.push({ val: null,      label: '○  Rimuovi dal Focus' });
    if (!opts.length) return;

    const dropdown = document.createElement('div');
    dropdown.className = 'focus-dropdown';
    opts.forEach(o => {
      const div = document.createElement('div');
      div.className = 'focus-dropdown-opt';
      div.textContent = o.label;
      div.onclick = ev => { ev.stopPropagation(); setFocus(voceId, o.val); dropdown.remove(); };
      dropdown.appendChild(div);
    });

    const btn = e.currentTarget;
    btn.style.position = 'relative';
    btn.appendChild(dropdown);
    setTimeout(() => document.addEventListener('click', function h() {
      dropdown.remove(); document.removeEventListener('click', h);
    }), 0);
  }

  let azioneTimer;
  function saveFocusAzione() {
    clearTimeout(azioneTimer);
    azioneTimer = setTimeout(async () => {
      const attivo = db.voci.find(v => v.focus === 'attivo');
      if (!attivo || !isLocal) return;
      const azione = document.getElementById('focusAzione').value;
      attivo.focus_azione = azione;
      try {
        await fetch('/api/update-focus', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voce_id: attivo.id, focus: 'attivo', focus_azione: azione })
        });
      } catch { /* silent */ }
    }, 800);
  }

  // ─── TOAST ──────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, type = 'ok') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = '', 3200);
  }

  // ─── MODAL ──────────────────────────────────────────────────────────────────
  function openModal() {
    // Popola la select dei supporti per il tab etichetta
    const sel = document.getElementById('m-supporto-sel');
    sel.innerHTML = db.fonti.map(f => `<option value="${esc(f.id)}">${esc(f.label)}</option>`).join('');
    document.getElementById('modal').classList.add('open');
  }
  function closeModal() { document.getElementById('modal').classList.remove('open'); }
  document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });

  function switchModalTab(tab) {
    currentModalTab = tab;
    document.querySelectorAll('.modal-tab').forEach((el, i) => el.classList.toggle('active', (i===0 && tab==='supporto') || (i===1 && tab==='etichetta')));
    document.getElementById('panel-supporto').classList.toggle('active', tab === 'supporto');
    document.getElementById('panel-etichetta').classList.toggle('active', tab === 'etichetta');
  }

  function aggiungi() {
    if (currentModalTab === 'supporto') aggiungiSupporto();
    else aggiungiEtichetta();
  }

  // Le fonti/etichette vengono salvate dal server locale in data.json + sources.json.
  // Su GitHub Pages (read-only) l'aggiunta non è possibile.
  async function aggiungiSupporto() {
    if (!isLocal) { showToast('⚠ Aggiunta possibile solo dal server locale', 'warn'); return; }
    const label = document.getElementById('m-label').value.trim();
    const tipo  = document.getElementById('m-tipo').value;
    const note  = document.getElementById('m-note').value.trim();
    if (!label) { alert('Il nome del supporto è obbligatorio.'); return; }

    try {
      const res  = await fetch('/api/add-fonte', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label, tipo, note })
      });
      const json = await res.json();
      if (!json.ok) { showToast('⚠ ' + (json.error || 'Errore'), 'err'); return; }
      db.fonti.push(json.fonte);
      closeModal();
      ['m-label','m-note'].forEach(i => document.getElementById(i).value = '');
      renderSidebar(); renderStats();
      showToast('✓ Supporto "' + label + '" salvato', 'ok');
    } catch {
      showToast('✗ Server non raggiungibile', 'err');
    }
  }

  async function aggiungiEtichetta() {
    if (!isLocal) { showToast('⚠ Aggiunta possibile solo dal server locale', 'warn'); return; }
    const fId    = document.getElementById('m-supporto-sel').value;
    const label  = document.getElementById('m-et-label').value.trim();
    const colore = document.getElementById('m-et-colore').value;
    const path   = document.getElementById('m-et-percorso').value.trim();
    const desc   = document.getElementById('m-et-desc').value.trim();
    if (!label) { alert('Il nome dell\'etichetta è obbligatorio.'); return; }
    const supporto = db.fonti.find(f => f.id === fId);
    if (!supporto) return;

    try {
      const res  = await fetch('/api/add-etichetta', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fonte_id: fId, label, colore, percorso_radice: path, descrizione: desc })
      });
      const json = await res.json();
      if (!json.ok) { showToast('⚠ ' + (json.error || 'Errore'), 'err'); return; }
      if (!supporto.etichette) supporto.etichette = [];
      supporto.etichette.push(json.etichetta);
      if (path && supporto.stato === 'da-collegare') supporto.stato = 'parziale';
      closeModal();
      ['m-et-label','m-et-percorso','m-et-desc'].forEach(i => document.getElementById(i).value = '');
      expandedSupporti.add(fId);
      renderSidebar(); renderStats();
      showToast('✓ Etichetta "' + label + '" salvata su ' + supporto.label, 'ok');
    } catch {
      showToast('✗ Server non raggiungibile', 'err');
    }
  }

  // ─── SYNC GOOGLE DRIVE ──────────────────────────────────────────────────────
  async function syncDrive() {
    const btn = document.getElementById('btnSyncDrive');
    btn.disabled = true; btn.textContent = '☁ Sincronizzo...';
    try {
      const res  = await fetch('/api/sync-drive', { method: 'POST' });
      const json = await res.json();
      if (json.ok) showToast('☁ ' + (json.message || 'Sincronizzato'), 'ok');
      else         showToast('⚠ ' + (json.error || 'Errore di sincronizzazione'), 'err');
    } catch {
      showToast('✗ Server non raggiungibile', 'err');
    } finally {
      btn.disabled = false; btn.textContent = '☁ Sincronizza';
    }
  }

  // ─── EXPORT ─────────────────────────────────────────────────────────────────
  function exportJSON() {
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' })),
      download: 'data.json'
    });
    a.click();
  }

  loadData();
</script>
</body>
</html>
