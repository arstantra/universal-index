<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Index — Archivio Personale</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #4f7cff;
      --accent2: #7c4fff;
      --text: #e8eaf6;
      --text2: #8b92c4;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --err: #ff5c5c;
      --da-svuotare: #ff7043;
      --radius: 8px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

    /* HEADER */
    header {
      background: linear-gradient(135deg, var(--surface) 0%, #1e2140 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: .02em; }
    header h1 span { color: var(--accent); }
    #lastUpdated { color: var(--text2); font-size: 12px; }

    /* LAYOUT */
    .app { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 65px); }

    /* SIDEBAR */
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      overflow-y: auto;
    }
    aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text2); margin-bottom: 12px; padding: 0 4px; }
    .fonte-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: var(--radius); cursor: pointer;
      transition: background .1s; margin-bottom: 2px;
    }
    .fonte-item:hover { background: var(--surface2); }
    .fonte-item.active { background: var(--surface2); }
    .fonte-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .fonte-name { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fonte-count { font-size: 11px; color: var(--text2); background: var(--surface2); padding: 2px 7px; border-radius: 10px; }
    .fonte-stato {
      font-size: 10px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; font-weight: 500;
    }
    .fonte-stato.collegato    { background: #0d3326; color: var(--ok); }
    .fonte-stato.da-collegare { background: #1e1e2e; color: var(--text2); }
    .fonte-stato.da-svuotare  { background: #2a1200; color: var(--da-svuotare); }

    /* tipo dot colors */
    .dot-locale  { background: var(--accent); }
    .dot-gdrive  { background: var(--ok); }
    .dot-dropbox { background: #6c86c4; }

    .add-fonte-btn {
      width: 100%; padding: 8px; border-radius: var(--radius);
      background: transparent; border: 1px dashed var(--border);
      color: var(--text2); cursor: pointer; font-size: 12px;
      transition: all .15s; margin-top: 8px;
    }
    .add-fonte-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* LOCAL SERVER BADGE */
    #localBadge {
      display: none;
      font-size: 11px; padding: 3px 10px; border-radius: 10px;
      background: #0d3326; color: var(--ok); border: 1px solid #1a5c3a;
      margin-top: 10px; text-align: center;
    }

    /* MAIN */
    main { padding: 24px 32px; overflow-y: auto; }

    /* STATS BAR */
    .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 20px; flex: 1; min-width: 120px;
    }
    .stat-card .num { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat-card .lbl { font-size: 11px; color: var(--text2); margin-top: 2px; text-transform: uppercase; letter-spacing: .05em; }

    /* TOOLBAR */
    .toolbar { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
    .search-wrap { position: relative; flex: 1; min-width: 200px; }
    .search-wrap input {
      width: 100%; padding: 9px 14px 9px 36px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-size: 13px; outline: none; transition: border .15s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 14px; pointer-events: none; }
    select {
      padding: 9px 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); font-size: 13px; outline: none; cursor: pointer;
    }
    select:focus { border-color: var(--accent); }

    /* VIEW TOGGLE */
    .view-toggle {
      display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; flex-shrink: 0;
    }
    .view-toggle button {
      padding: 8px 14px; background: transparent; border: none; color: var(--text2);
      cursor: pointer; font-size: 12px; font-weight: 500; transition: all .15s; white-space: nowrap;
    }
    .view-toggle button:hover { background: var(--surface2); color: var(--text); }
    .view-toggle button.active { background: var(--surface2); color: var(--accent); }
    .view-toggle button:first-child { border-right: 1px solid var(--border); }

    /* TABLE */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left; padding: 10px 14px;
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      color: var(--text2); border-bottom: 1px solid var(--border);
      cursor: pointer; user-select: none; white-space: nowrap;
    }
    thead th:hover { color: var(--text); }
    thead th .sort-arrow { margin-left: 4px; opacity: .4; }
    thead th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; cursor: default; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 10px 14px; font-size: 13px; vertical-align: middle; }
    .cell-titolo { font-weight: 500; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell-percorso { color: var(--text2); font-size: 11px; font-family: monospace; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell-fonte { font-size: 12px; }

    /* BADGES */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .badge-stato-completo       { background: #0d3326; color: var(--ok); }
    .badge-stato-in-lavorazione { background: #1a2a45; color: #6aadff; }
    .badge-stato-da-revisionare { background: #2a2300; color: var(--warn); }
    .badge-stato-archivio-morto { background: #1e1e1e; color: #888; }
    .badge-tipo { background: var(--surface2); color: var(--text2); }

    /* STATO BUTTON (locale only) */
    .stato-btn {
      display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;
      white-space: nowrap; cursor: pointer; border: none; position: relative;
      transition: opacity .15s, transform .1s;
    }
    .stato-btn:hover:not(.frozen) { opacity: .8; transform: scale(1.05); }
    .stato-btn.frozen { cursor: not-allowed; opacity: .5; }

    .stato-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,.5); min-width: 170px; padding: 4px;
    }
    .stato-dropdown-opt {
      padding: 7px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
      transition: background .1s; display: flex; align-items: center; gap: 8px;
    }
    .stato-dropdown-opt:hover { background: var(--surface2); }
    .stato-dropdown-opt.current { opacity: .35; cursor: default; pointer-events: none; }
    .dot-opt { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-completo       { background: var(--ok); }
    .dot-in-lavorazione { background: #6aadff; }
    .dot-da-revisionare { background: var(--warn); }
    .dot-archivio-morto { background: #888; }

    /* TOAST */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 18px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
      transform: translateY(80px); opacity: 0; transition: all .25s;
      max-width: 320px; pointer-events: none;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.ok   { border-left: 3px solid var(--ok); }
    #toast.warn { border-left: 3px solid var(--warn); }
    #toast.err  { border-left: 3px solid var(--err); }

    /* ── TREE VIEW ─────────────────────────────────────────────────────────── */
    .tree-wrap { display: none; }

    .tree-folder-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; cursor: pointer; border-radius: var(--radius);
      transition: background .1s; user-select: none;
    }
    .tree-folder-row:hover { background: var(--surface2); }
    .tree-arrow { font-size: 9px; color: var(--text2); width: 12px; text-align: center; flex-shrink: 0; }
    .tree-folder-icon { font-size: 14px; flex-shrink: 0; }
    .tree-folder-name { font-size: 13px; font-weight: 500; flex: 1; }
    .tree-folder-count {
      font-size: 11px; color: var(--text2); background: var(--surface2);
      padding: 1px 7px; border-radius: 10px; flex-shrink: 0;
    }
    .tree-children { display: none; }
    .tree-children.open { display: block; }

    .tree-leaf-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: var(--radius);
      transition: background .1s;
    }
    .tree-leaf-row:hover { background: var(--surface2); }
    .tree-leaf-icon  { font-size: 13px; flex-shrink: 0; color: var(--text2); }
    .tree-leaf-title { font-size: 13px; flex: 1; }
    .tree-leaf-tags  { font-size: 11px; color: var(--text2); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tree-fonte-chip { font-size: 10px; color: var(--text2); background: var(--surface2); padding: 1px 6px; border-radius: 4px; flex-shrink: 0; }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 60px 20px; color: var(--text2); }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }

    /* PENDENZE PANEL */
    .pendenze-section { margin-top: 32px; }
    .pendenze-section h2 { font-size: 14px; font-weight: 600; color: var(--warn); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .pendenza-list { display: flex; flex-direction: column; gap: 8px; }
    .pendenza-item {
      background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--warn);
      border-radius: var(--radius); padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .pendenza-item .p-title { font-size: 13px; font-weight: 500; }
    .pendenza-item .p-meta  { font-size: 11px; color: var(--text2); margin-top: 2px; }

    /* MODAL */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 28px; width: 420px; max-width: 95vw;
    }
    .modal h3 { font-size: 16px; margin-bottom: 20px; }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    .form-row input, .form-row select { width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; outline: none; }
    .form-row input:focus, .form-row select:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn { padding: 9px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: opacity .15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .85; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--text2); }

    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 220px; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Universal <span>Index</span></h1>
    <div id="lastUpdated">Caricamento...</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <button class="btn btn-ghost" onclick="exportJSON()">⬇ Esporta JSON</button>
    <button class="btn btn-primary" onclick="openModal()">＋ Aggiungi Fonte</button>
  </div>
</header>

<div class="app">

  <aside>
    <h2>Fonti</h2>
    <div id="fonteList"></div>
    <div id="localBadge">● server locale attivo</div>
  </aside>

  <main>
    <div class="stats" id="statsBar"></div>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="text" placeholder="Cerca per titolo, percorso, tag..." oninput="applyFilters()" />
      </div>
      <select id="filterStato" onchange="applyFilters()">
        <option value="">Tutti gli stati</option>
        <option value="completo">Completo</option>
        <option value="in-lavorazione">In lavorazione</option>
        <option value="da-revisionare">Da revisionare</option>
        <option value="archivio-morto">Archivio morto</option>
      </select>
      <select id="filterTipo" onchange="applyFilters()">
        <option value="">Tutti i tipi</option>
        <option value="progetto">Progetto</option>
        <option value="relazione">Relazione</option>
        <option value="convegno">Convegno</option>
        <option value="appunti">Appunti</option>
        <option value="portfolio">Portfolio</option>
      </select>
      <select id="filterAnno" onchange="applyFilters()">
        <option value="">Tutti gli anni</option>
      </select>
      <div class="view-toggle">
        <button id="btnLista"  class="active" onclick="switchView('lista')">☰ Lista</button>
        <button id="btnAlbero"            onclick="switchView('albero')">🌲 Albero</button>
      </div>
    </div>

    <!-- Vista lista -->
    <div class="table-wrap" id="tableWrap">
      <table>
        <thead>
          <tr>
            <th onclick="sortBy('titolo')">Titolo <span class="sort-arrow" id="arrow-titolo">↕</span></th>
            <th onclick="sortBy('anno')">Anno <span class="sort-arrow" id="arrow-anno">↕</span></th>
            <th onclick="sortBy('tipo')">Tipo <span class="sort-arrow" id="arrow-tipo">↕</span></th>
            <th onclick="sortBy('stato')">Stato <span class="sort-arrow" id="arrow-stato">↕</span></th>
            <th onclick="sortBy('fonte')">Fonte <span class="sort-arrow" id="arrow-fonte">↕</span></th>
            <th>Percorso</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- Vista albero -->
    <div class="tree-wrap" id="treeWrap"></div>

    <div id="emptyState" class="empty" style="display:none;">
      <div class="icon">📂</div>
      <div>Nessuna voce trovata con i filtri attivi.</div>
    </div>

    <div class="pendenze-section" id="pendenzeSection" style="display:none;">
      <h2>⚠ Pendenze da revisionare</h2>
      <div class="pendenza-list" id="pendenzeList"></div>
    </div>
  </main>
</div>

<!-- MODAL aggiungi fonte -->
<div class="overlay" id="modal">
  <div class="modal">
    <h3>➕ Aggiungi Fonte</h3>
    <div class="form-row">
      <label>ID univoco (es. ssd3)</label>
      <input id="m-id" type="text" placeholder="ssd3" />
    </div>
    <div class="form-row">
      <label>Etichetta leggibile</label>
      <input id="m-label" type="text" placeholder="SSD 3 — Samsung T7" />
    </div>
    <div class="form-row">
      <label>Tipo</label>
      <select id="m-tipo">
        <option value="locale">Locale (HD/SSD/computer)</option>
        <option value="gdrive">Google Drive</option>
        <option value="dropbox">Dropbox</option>
        <option value="altro">Altro</option>
      </select>
    </div>
    <div class="form-row">
      <label>Note</label>
      <input id="m-note" type="text" placeholder="opzionale" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
      <button class="btn btn-primary" onclick="aggiungiFornte()">Aggiungi</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
  let db = { meta: {}, fonti: [], voci: [] };
  let filteredVoci = [];
  let activeFonte  = 'all';
  let sortKey      = 'anno';
  let sortDir      = -1;
  let currentView  = 'lista';
  let expandedNodes = new Set();

  const isLocal = (location.protocol === 'http:') &&
    (location.hostname === 'localhost' || location.hostname === '127.0.0.1');

  // ─── LOAD ───────────────────────────────────────────────────────────────────
  async function loadData() {
    try {
      const r = await fetch('data.json');
      db = await r.json();
    } catch(e) {
      db = {
        meta: { lastUpdated: '—' },
        fonti: [{ id:'demo', label:'Demo', tipo:'locale', stato:'da-collegare', note:'' }],
        voci: []
      };
    }
    init();
  }

  function init() {
    document.getElementById('lastUpdated').textContent = 'Aggiornato: ' + (db.meta.lastUpdated || '—');
    if (isLocal) document.getElementById('localBadge').style.display = 'block';
    renderSidebar();
    populateAnnoFilter();
    applyFilters();
  }

  // ─── SIDEBAR ────────────────────────────────────────────────────────────────
  function renderSidebar() {
    const container = document.getElementById('fonteList');
    const countAll  = db.voci.length;
    container.innerHTML = `
      <div class="fonte-item active" data-id="all" onclick="selectFonte('all')">
        <div class="fonte-dot" style="background:#4f7cff"></div>
        <div class="fonte-name">Tutte le fonti</div>
        <div class="fonte-count">${countAll}</div>
      </div>`;
    db.fonti.forEach(f => {
      const count = db.voci.filter(v => v.fonte === f.id).length;
      const statoClass = f.stato.replace(/\s/g,'-');
      container.innerHTML += `
        <div class="fonte-item" data-id="${f.id}" onclick="selectFonte('${f.id}')">
          <div class="fonte-dot dot-${f.tipo}"></div>
          <div class="fonte-name" title="${f.label}">${f.label}</div>
          <span class="fonte-stato ${statoClass}">${f.stato}</span>
          <div class="fonte-count">${count}</div>
        </div>`;
    });
    container.innerHTML += `<button class="add-fonte-btn" onclick="openModal()">＋ Nuova fonte</button>`;
  }

  function selectFonte(id) {
    activeFonte = id;
    document.querySelectorAll('.fonte-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
    applyFilters();
  }

  // ─── FILTERS ────────────────────────────────────────────────────────────────
  function populateAnnoFilter() {
    const anni = [...new Set(db.voci.map(v => v.anno).filter(Boolean))].sort().reverse();
    const sel  = document.getElementById('filterAnno');
    anni.forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; sel.appendChild(o); });
  }

  function applyFilters() {
    const q     = document.getElementById('searchInput').value.toLowerCase();
    const stato = document.getElementById('filterStato').value;
    const tipo  = document.getElementById('filterTipo').value;
    const anno  = document.getElementById('filterAnno').value;

    filteredVoci = db.voci.filter(v => {
      if (activeFonte !== 'all' && v.fonte !== activeFonte) return false;
      if (stato && v.stato !== stato) return false;
      if (tipo  && v.tipo  !== tipo)  return false;
      if (anno  && v.anno  !== anno)  return false;
      if (q) {
        const hay = [v.titolo, v.percorso, ...(v.tags||[])].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    sortData();
    if (currentView === 'lista') renderTable();
    else renderTree();
    renderStats();
    renderPendenze();
  }

  // ─── VIEW TOGGLE ────────────────────────────────────────────────────────────
  function switchView(v) {
    currentView = v;
    document.getElementById('btnLista').classList.toggle('active',  v === 'lista');
    document.getElementById('btnAlbero').classList.toggle('active', v === 'albero');
    document.getElementById('tableWrap').style.display = v === 'lista'  ? 'block' : 'none';
    document.getElementById('treeWrap').style.display  = v === 'albero' ? 'block' : 'none';
    if (v === 'lista') renderTable(); else renderTree();
  }

  // ─── SORT ───────────────────────────────────────────────────────────────────
  function sortBy(key) {
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    document.querySelectorAll('.sort-arrow').forEach(el => el.textContent = '↕');
    document.querySelectorAll('thead th').forEach(el => el.classList.remove('sorted'));
    const th = document.querySelector(`[onclick="sortBy('${key}')"]`);
    if (th) { th.classList.add('sorted'); th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '↑' : '↓'; }
    sortData(); renderTable();
  }

  function sortData() {
    filteredVoci.sort((a,b) => (a[sortKey]||'').toString().localeCompare((b[sortKey]||'').toString()) * sortDir);
  }

  // ─── STATO BADGE ────────────────────────────────────────────────────────────
  function isFonteCollegata(fonteId) {
    if (!isLocal) return false;
    const f = db.fonti.find(f => f.id === fonteId);
    return f && f.stato !== 'da-collegare' && f.stato !== 'da-svuotare';
  }

  function statoBadgeHTML(v) {
    const cls = `badge-stato-${v.stato || ''}`;
    if (!isLocal) return `<span class="badge ${cls}">${v.stato || '—'}</span>`;
    const col   = isFonteCollegata(v.fonte);
    const frzCls = col ? '' : 'frozen';
    const title  = col ? 'Clicca per cambiare stato' : 'Fonte non collegata — sola lettura';
    return `<button class="stato-btn ${cls} ${frzCls}" title="${title}"
      onclick="onStatoClick(event,'${v.id}','${v.stato}',${col})"
    >${v.stato || '—'}</button>`;
  }

  const STATI_LIST = [
    { val: 'completo',        label: 'Completo' },
    { val: 'in-lavorazione',  label: 'In lavorazione' },
    { val: 'da-revisionare',  label: 'Da revisionare' },
    { val: 'archivio-morto',  label: 'Archivio morto' },
  ];

  function onStatoClick(e, voceId, statoAtt, collegata) {
    e.stopPropagation();
    if (!collegata) return;
    document.querySelectorAll('.stato-dropdown').forEach(d => d.remove());

    const dropdown = document.createElement('div');
    dropdown.className = 'stato-dropdown';
    STATI_LIST.forEach(s => {
      const opt = document.createElement('div');
      opt.className = 'stato-dropdown-opt' + (s.val === statoAtt ? ' current' : '');
      opt.innerHTML = `<span class="dot-opt dot-${s.val}"></span>${s.label}`;
      if (s.val !== statoAtt) opt.onclick = ev => { ev.stopPropagation(); cambiaStato(voceId, s.val); dropdown.remove(); };
      dropdown.appendChild(opt);
    });

    const btn = e.currentTarget;
    btn.style.position = 'relative';
    btn.appendChild(dropdown);
    setTimeout(() => document.addEventListener('click', function h() { dropdown.remove(); document.removeEventListener('click', h); }), 0);
  }

  async function cambiaStato(voceId, nuovoStato) {
    try {
      const res  = await fetch('/api/update-stato', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ voce_id: voceId, stato: nuovoStato })
      });
      const json = await res.json();
      if (!json.ok) { showToast('⚠ ' + (json.error || 'Errore'), 'err'); return; }
      const voce = db.voci.find(v => v.id === voceId);
      if (voce) voce.stato = nuovoStato;
      applyFilters();
      showToast(json.readme_updated ? '✓ Stato salvato — README.md aggiornato' : '⚠ data.json OK, README non trovato', json.readme_updated ? 'ok' : 'warn');
    } catch {
      showToast('✗ Server non raggiungibile', 'err');
    }
  }

  // ─── TABLE ──────────────────────────────────────────────────────────────────
  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const empty = document.getElementById('emptyState');
    if (filteredVoci.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    const fonteMap = Object.fromEntries(db.fonti.map(f => [f.id, f.label]));
    tbody.innerHTML = filteredVoci.map(v => `
      <tr>
        <td>
          <div class="cell-titolo" title="${v.titolo}">${v.titolo || '—'}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px;">${(v.tags||[]).join(' · ')}</div>
        </td>
        <td>${v.anno || '—'}</td>
        <td><span class="badge badge-tipo">${v.tipo || '—'}</span></td>
        <td>${statoBadgeHTML(v)}</td>
        <td class="cell-fonte" title="${fonteMap[v.fonte]||v.fonte}">${labelShort(v.fonte)}</td>
        <td><div class="cell-percorso" title="${v.percorso}">${v.percorso || '—'}</div></td>
      </tr>`).join('');
  }

  function labelShort(id) {
    const f = db.fonti.find(f => f.id === id);
    if (!f) return id;
    return f.label.length > 22 ? f.label.slice(0,20) + '…' : f.label;
  }

  // ─── TREE ───────────────────────────────────────────────────────────────────
  function cleanName(name) {
    return name.replace(/^\d{3}_/, '').replace(/_/g, ' ');
  }

  function buildTree(voci) {
    const root = { children: {}, items: [] };
    voci.forEach(v => {
      const parts = (v.percorso || '').split('/').filter(Boolean);
      if (!parts.length) { root.items.push(v); return; }
      let node = root;
      for (let i = 0; i < parts.length - 1; i++) {
        const p = parts[i];
        if (!node.children[p]) node.children[p] = { name: p, path: parts.slice(0,i+1).join('/'), children: {}, items: [] };
        node = node.children[p];
      }
      const last = parts[parts.length - 1];
      if (!node.children[last]) node.children[last] = { name: last, path: parts.join('/'), children: {}, items: [] };
      node.children[last].items.push(v);
    });
    return root;
  }

  function countItems(node) {
    let n = node.items.length;
    Object.values(node.children).forEach(c => n += countItems(c));
    return n;
  }

  function renderTreeNode(node, depth) {
    let html = '';
    const indent    = depth * 20;
    const showFonte = activeFonte === 'all';

    Object.keys(node.children).sort((a,b) => a.localeCompare(b)).forEach(key => {
      const child  = node.children[key];
      const total  = countItems(child);
      const nodeId = 'tn-' + child.path.replace(/[^a-z0-9]/gi, '-');
      const isOpen = expandedNodes.has(nodeId);
      const icon   = depth === 0 ? '🗂' : '📁';

      html += `
        <div>
          <div class="tree-folder-row" style="padding-left:${12 + indent}px" onclick="toggleTreeNode('${nodeId}')">
            <span class="tree-arrow">${isOpen ? '▼' : '▶'}</span>
            <span class="tree-folder-icon">${icon}</span>
            <span class="tree-folder-name">${cleanName(key)}</span>
            <span class="tree-folder-count">${total}</span>
          </div>
          <div class="tree-children ${isOpen ? 'open' : ''}" id="${nodeId}">
            ${renderTreeNode(child, depth + 1)}
          </div>
        </div>`;
    });

    node.items.forEach(v => {
      html += `
        <div class="tree-leaf-row" style="padding-left:${12 + indent + 20}px">
          <span class="tree-leaf-icon">📄</span>
          <span class="tree-leaf-title">${v.titolo || cleanName(v.percorso.split('/').pop())}</span>
          ${(v.tags||[]).length ? `<span class="tree-leaf-tags">${v.tags.slice(0,3).join(' · ')}</span>` : ''}
          ${showFonte ? `<span class="tree-fonte-chip">${labelShort(v.fonte)}</span>` : ''}
          <span style="margin-left:4px">${statoBadgeHTML(v)}</span>
          <span class="badge badge-tipo" style="margin-left:4px">${v.tipo || '—'}</span>
        </div>`;
    });

    return html;
  }

  function renderTree() {
    const wrap  = document.getElementById('treeWrap');
    const empty = document.getElementById('emptyState');
    if (filteredVoci.length === 0) { wrap.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    wrap.innerHTML = renderTreeNode(buildTree(filteredVoci), 0);
  }

  function toggleTreeNode(nodeId) {
    const el = document.getElementById(nodeId);
    if (!el) return;
    const isOpen = el.classList.toggle('open');
    if (isOpen) expandedNodes.add(nodeId); else expandedNodes.delete(nodeId);
    const row = el.previousElementSibling;
    if (row) { const a = row.querySelector('.tree-arrow'); if (a) a.textContent = isOpen ? '▼' : '▶'; }
  }

  // ─── STATS ──────────────────────────────────────────────────────────────────
  function renderStats() {
    const c = s => filteredVoci.filter(v => v.stato === s).length;
    document.getElementById('statsBar').innerHTML = `
      <div class="stat-card"><div class="num">${filteredVoci.length}</div><div class="lbl">Voci totali</div></div>
      <div class="stat-card"><div class="num" style="color:var(--ok)">${c('completo')}</div><div class="lbl">Completi</div></div>
      <div class="stat-card"><div class="num" style="color:#6aadff">${c('in-lavorazione')}</div><div class="lbl">In lavorazione</div></div>
      <div class="stat-card"><div class="num" style="color:var(--warn)">${c('da-revisionare')}</div><div class="lbl">Da revisionare</div></div>
      <div class="stat-card"><div class="num" style="color:#888">${c('archivio-morto')}</div><div class="lbl">Archivio morto</div></div>
      <div class="stat-card"><div class="num" style="color:var(--accent2)">${db.fonti.length}</div><div class="lbl">Fonti registrate</div></div>`;
  }

  // ─── PENDENZE ───────────────────────────────────────────────────────────────
  function renderPendenze() {
    const pendenze = db.voci.filter(v => v.stato === 'da-revisionare');
    const section  = document.getElementById('pendenzeSection');
    if (pendenze.length === 0) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    const fonteMap = Object.fromEntries(db.fonti.map(f => [f.id, f.label]));
    document.getElementById('pendenzeList').innerHTML = pendenze.map(v => `
      <div class="pendenza-item">
        <div>
          <div class="p-title">${v.titolo}</div>
          <div class="p-meta">${fonteMap[v.fonte]||v.fonte} › ${v.percorso}</div>
        </div>
        <span class="badge badge-tipo">${v.tipo}</span>
      </div>`).join('');
  }

  // ─── TOAST ──────────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, type = 'ok') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = '', 3200);
  }

  // ─── MODAL ──────────────────────────────────────────────────────────────────
  function openModal()  { document.getElementById('modal').classList.add('open'); }
  function closeModal() { document.getElementById('modal').classList.remove('open'); }
  document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });

  function aggiungiFornte() {
    const id = document.getElementById('m-id').value.trim();
    const label = document.getElementById('m-label').value.trim();
    const tipo  = document.getElementById('m-tipo').value;
    const note  = document.getElementById('m-note').value.trim();
    if (!id || !label) { alert('ID e Etichetta sono obbligatori.'); return; }
    if (db.fonti.find(f => f.id === id)) { alert('ID già esistente.'); return; }
    db.fonti.push({ id, label, tipo, stato: 'da-collegare', note });
    closeModal();
    ['m-id','m-label','m-note'].forEach(i => document.getElementById(i).value = '');
    renderSidebar(); renderStats();
  }

  // ─── EXPORT ─────────────────────────────────────────────────────────────────
  function exportJSON() {
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' })),
      download: 'data.json'
    });
    a.click();
  }

  loadData();
</script>
</body>
</html>
